# Perspectives — hand-curated framing quotes for the bill drill-down "Perspectives" panel
# (issue #9 prototype).
#
# WHAT THIS IS
# ------------
# For a bill, this file holds VERBATIM quoted excerpts showing how the bill's sponsor(s)
# frame it vs. how opponents frame it — e.g. a sponsor's press release ("this bill cuts
# red tape and protects small businesses") next to an opponent's floor statement ("this
# bill guts consumer protections"). The site renders these side by side, clearly labeled
# as partisan framing (not neutral fact), each with attribution and a source link so a
# reader can verify the quote in context.
#
# This file is compiled + validated by `src/build_perspectives.py` into
# `docs/data/perspectives.json`, which the site fetches lazily and 404-tolerantly (a bill
# with no curated perspectives yet simply shows nothing).
#
# EDITORIAL RULES (read before adding an entry)
# -----------------------------------------------
# 1. VERBATIM ONLY. `excerpt` must be an exact quotation from the source — copy/paste it,
#    do not paraphrase, summarize, or otherwise generate/rewrite the text. Nothing in this
#    file should ever be LLM-written; it is a direct quote of what a real person/office said.
# 2. Keep excerpts short: <= 600 characters. Trim with ellipses if needed, but never alter
#    the meaning of the remaining text.
# 3. Every entry needs a working, public `source_url` you can point a reader to — the page
#    (or an archived copy) where the excerpt actually appears. No paywalled-only sources
#    without a public mirror.
# 4. Label the kind of source with `source_kind` (press_release | floor_statement | op_ed |
#    dear_colleague) so readers know the register the quote came from.
# 5. Include `date` (YYYY-MM-DD) whenever it's knowable from the source. Omit it if the
#    source is genuinely undated rather than guessing.
# 6. Attribute honestly: `name` should identify the specific person/office quoted (e.g.
#    "Rep. Mike Rogers (R-AL)", not just "Republicans"). `stance` records whether they were
#    speaking as the bill's sponsor/a supporter or as an opponent — entries under the
#    `sponsor` list must use stance `sponsor` or `supporter`; entries under `opponents`
#    must use stance `opponent`.
#
# SCHEMA
# ------
# bills:
#   "<bill_id>":                     # e.g. "118-hr-2670" (congress-billtype-number, lowercase)
#     sponsor:                       # optional; framing FROM the bill's sponsor(s)/supporters
#       - name: str                  # required, who is being quoted
#         stance: sponsor|supporter  # required
#         excerpt: str               # required, verbatim, <= 600 chars
#         source_url: str            # required, http(s) URL
#         source_kind: press_release|floor_statement|dear_colleague|op_ed   # required
#         date: "YYYY-MM-DD"         # optional
#     opponents:                     # optional; framing FROM the bill's opponents
#       - name: str                  # required
#         stance: opponent           # required
#         excerpt: str               # required, verbatim, <= 600 chars
#         source_url: str            # required, http(s) URL
#         source_kind: press_release|floor_statement|dear_colleague|op_ed   # required
#         date: "YYYY-MM-DD"         # optional
#
# Both `sponsor` and `opponents` are optional per bill, but if present must be a non-empty
# list. A bill with nothing curated yet simply has no key under `bills`.
#
# Every excerpt below was independently verified against its source_url at curation time
# (the exact passage confirmed present on the page). If a source page moves, prefer
# swapping in an archived copy over deleting the entry.

bills:
  "118-s-2073":   # Kids Online Safety and Privacy Act (KOSA package; passed Senate 91-3)
    sponsor:
      - name: "Sen. Richard Blumenthal (D-CT)"
        stance: sponsor
        excerpt: "This moving and historic day marks a major win for our children. Anyone who doubted whether we'd reach this milestone has never met our advocates – the parents who have lost children and the young people who refused to be treated like Big Tech piggy banks."
        source_url: "https://www.blumenthal.senate.gov/newsroom/press/release/blumenthal-and-blackburn-celebrate-senate-passage-of-the-bipartisan-kids-online-safety-act"
        source_kind: press_release
        date: "2024-07-30"
      - name: "Sen. Marsha Blackburn (R-TN)"
        stance: sponsor
        excerpt: "Today, the Senate took a major step forward in protecting children online by passing the bipartisan Kids Online Safety Act. This legislation provides young people and parents with the tools, safeguards, and transparency they need to protect against online harms."
        source_url: "https://www.blumenthal.senate.gov/newsroom/press/release/blumenthal-and-blackburn-celebrate-senate-passage-of-the-bipartisan-kids-online-safety-act"
        source_kind: press_release
        date: "2024-07-30"
    opponents:
      - name: "Sen. Ron Wyden (D-OR)"
        stance: opponent
        excerpt: "I fear this bill could be used to sue services that offer privacy-enhancing technologies like encryption or anonymity features that are essential to young people's ability to communicate securely and privately without being spied on by predators online… For these reasons, I cannot vote for this legislation."
        source_url: "https://www.wyden.senate.gov/news/press-releases/wyden-statement-on-the-kids-online-safety-act"
        source_kind: press_release
        date: "2024-07-25"
      - name: "Sen. Rand Paul (R-KY)"
        stance: opponent
        excerpt: "KOSA would impose an unprecedented duty of care on internet platforms to design their sites to mitigate and prevent harms associated with mental health, such as anxiety, depression and eating disorders. This requirement will not only stifle free speech, but it will deprive Americans of the benefits of our technological advancements."
        source_url: "https://www.paul.senate.gov/op_eds/courier-journal-op-ed-kosa-is-not-the-solution-for-protecting-children-from-social-media/"
        source_kind: op_ed
        date: "2024-08-07"

  "118-hjres-26":   # Disapproval of DC's Revised Criminal Code Act (signed March 2023)
    sponsor:
      - name: "Rep. Andrew Clyde (R-GA)"
        stance: sponsor
        excerpt: "The D.C. Council's radical rewrite of the criminal code threatens the well-being of both Washingtonians and visitors — making our nation's capital city a safe haven for violent criminals. In response to this dangerous and severely misguided measure, it's now up to Congress to save our nation's capital from itself."
        source_url: "https://clyde.house.gov/news/documentsingle.aspx?DocumentID=671"
        source_kind: press_release
        date: "2023-02-02"
      - name: "Sen. Bill Hagerty (R-TN)"
        stance: sponsor
        excerpt: "The American public has had enough of the crime wave that's rolling across our country, including in our nation's capital. Congress is tasked with overseeing Washington, D.C.—a federal district where people should be safe to live and work."
        source_url: "https://www.hagerty.senate.gov/press-releases/2023/02/09/hagerty-colleagues-introduce-resolution-to-block-dcs-dangerous-crime-bill/"
        source_kind: press_release
        date: "2023-02-09"
    opponents:
      - name: "Del. Eleanor Holmes Norton (D-DC)"
        stance: opponent
        excerpt: "I strongly oppose this profoundly undemocratic, paternalistic resolution."
        source_url: "https://norton.house.gov/media/press-releases/norton-releases-floor-statement-disapproval-resolution-dcs-revised-criminal"
        source_kind: floor_statement
        date: "2023-02-09"
      - name: "Del. Eleanor Holmes Norton (D-DC)"
        stance: opponent
        excerpt: "The House of Representatives, in which the nearly 700,000 District of Columbia residents have no voting representation, is attempting to nullify legislation enacted by D.C.'s local legislature, whose members are elected by D.C. residents."
        source_url: "https://norton.house.gov/media/press-releases/norton-releases-floor-statement-disapproval-resolution-dcs-revised-criminal"
        source_kind: floor_statement
        date: "2023-02-09"

  "118-hr-8580":   # Military Construction, Veterans Affairs Appropriations Act, 2025
    sponsor:
      - name: "Rep. John Carter (R-TX), MilCon-VA Subcommittee Chairman"
        stance: sponsor
        excerpt: "This special bill supports our troops, their families, and the nation's veterans. The bill makes good on the Republican commitment to bring bills to the floor that comply with the Fiscal Responsibility Act, while honoring our commitment to our nation's veterans and our troops. To honor that commitment, the bill provides full funding for health care and benefits for veterans."
        source_url: "https://appropriations.house.gov/news/press-releases/carter-cole-were-fully-funding-veteran-health-care-supporting-military-families"
        source_kind: press_release
        date: "2024-06-04"
      - name: "Rep. Tom Cole (R-OK), Appropriations Committee Chairman"
        stance: sponsor
        excerpt: "Those who have worn the uniform, past and present, took an oath to defend our country, our ideals, and our people… The bill provides robust funding for military construction projects, with a particular focus on the Pacific region and military family housing… Even more importantly, the legislation provides full funding for health care and benefits for our nation's veterans."
        source_url: "https://appropriations.house.gov/news/press-releases/carter-cole-were-fully-funding-veteran-health-care-supporting-military-families"
        source_kind: press_release
        date: "2024-06-04"
    opponents:
      - name: "Rep. Debbie Wasserman Schultz (D-FL), MilCon-VA Subcommittee Ranking Member"
        stance: opponent
        excerpt: "Little that we do in Congress is more critical than caring for our veterans and improving the quality of life of our servicemembers and their families. Yet my Republican colleagues opted to construct a MilCon-VA bill that cuts military construction and climate resiliency that betrays this basic commitment and diminishes America's national security… Lastly, this bill is riddled with extremist policy riders that further erode women's reproductive rights and cruelly target LGBTQ+ and other diverse communities."
        source_url: "https://democrats-appropriations.house.gov/news/press-releases/house-republicans-milcon-va-funding-bill-fails-meet-needs-veterans"
        source_kind: press_release
        date: "2024-06-05"
      - name: "Rep. Rosa DeLauro (D-CT), Appropriations Committee Ranking Member"
        stance: opponent
        excerpt: "House Republicans 2025 Military Construction and Veterans Affairs funding bill fails our veterans and hurts military readiness. It disarms our military in the face of the climate crisis and recklessly undermines the ability to keep guns out of the hands of those prohibited under Federal law from purchasing or possessing firearms."
        source_url: "https://democrats-appropriations.house.gov/news/press-releases/house-republicans-milcon-va-funding-bill-fails-meet-needs-veterans"
        source_kind: press_release
        date: "2024-06-05"

